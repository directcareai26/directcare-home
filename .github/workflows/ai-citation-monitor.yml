name: AI Citation Monitor (Item #68)

on:
  schedule:
    - cron: "0 14 * * 1"        # every Monday at 14:00 UTC (10am ET)
  workflow_dispatch:             # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run monitor
        working-directory: scripts/ai-citation-monitor
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:     ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
        run: python monitor.py

      - name: Commit results
        run: |
          git config user.name "ai-citation-bot"
          git config user.email "bot@directcare.ai"
          git add scripts/ai-citation-monitor/results
          git diff --cached --quiet || git commit -m "AI citation report $(date -u +%Y-%m-%d) [skip ci]"
          git push
