name: Daily SEO/AEO/GEO Report

# Daily SEO + AEO + GEO + web-mentions + keyword brief to Dache (Slack webhook + email).
# Runs fully in the cloud. 11:00 UTC = 7:00 AM EDT (summer) / 6:00 AM EST (winter).

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: daily-seo-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r scripts/seo-daily/requirements.txt
      - name: Build & send daily report
        env:
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLACK_WEBHOOK_GROWTH: ${{ secrets.SLACK_WEBHOOK_GROWTH }}
          SLACK_WEBHOOK_PERSONAL: ${{ secrets.SLACK_WEBHOOK_PERSONAL }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_HOST: ${{ secrets.GMAIL_SMTP_HOST }}
          GMAIL_SMTP_PORT: ${{ secrets.GMAIL_SMTP_PORT }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python scripts/seo-daily/daily_report.py --send
