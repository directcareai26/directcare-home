# Manual / on-demand production deploy for www.directcare.ai.
# Mirrors the Vercel deploy step in daily-blog.yml so a content/config change
# (e.g. vercel.json redirects) can be published without waiting for the daily job.
# Reuses the existing VERCEL_TOKEN repo secret. Trigger from the Actions tab or `gh workflow run`.
name: Deploy to Vercel (manual)

on:
  workflow_dispatch:

concurrency:
  group: vercel-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Deploy to Vercel production
        env:
          VERCEL_ORG_ID: team_ICtN3SJuhyRwIU5Q1ujMl6cn
          VERCEL_PROJECT_ID: prj_n3jnECvkFJltSCUxVhZv47U6RKLF
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret not set — cannot deploy."; exit 1
          fi
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
