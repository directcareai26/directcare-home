name: Site Health Monitor

# Checks directcare.ai homepage, all critical product/funnel pages, and the live
# sitemap every 15 minutes. Alerts Slack the moment any URL stops returning HTTP 200,
# so a silent outage (like the product-page 404s) can never go unnoticed again.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: site-health
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run site health check
        env:
          SITE_HEALTH_WEBHOOK: ${{ secrets.SITE_HEALTH_WEBHOOK }}
        run: python scripts/site-health/site_health.py
